name: Ares Builder - Otonom APK Derleme

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Java 17 Ortamını Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Flutter Ortamını Kur (Sabit Sürüm)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Bağımlılıkları İndir
        run: flutter pub get

      - name: APK Derle (Release)
        run: flutter build apk --release

      - name: Derlenen APK'yı Artifact Olarak Sakla
        uses: actions/upload-artifact@v4
        with:
          name: AresBuilder-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Otomatik Release Oluştur ve Yükle
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
